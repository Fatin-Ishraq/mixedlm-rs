[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mixedlm-rs"
version = "0.1.0"
description = "Fast linear mixed-effects models for Python - lme4 speed, statsmodels API, no R required"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Fatin Ishraq" }]
keywords = [
    "lmer", "lme4", "mixed-effects", "mixed models", "multilevel",
    "hierarchical linear model", "REML", "random effects", "statsmodels",
    "mixedlm", "linear mixed model", "repeated measures",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5"]

[project.optional-dependencies]
formula = ["patsy>=0.5"]
test = ["pytest>=7", "statsmodels>=0.14", "patsy>=0.5"]

[tool.maturin]
python-source = "python"
module-name = "mixedlm_rs._mixedlm_rs"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
