[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mixedlm-rs"
version = "0.1.0"
description = "Fast linear mixed-effects models for Python - lme4 speed, statsmodels API, no R required"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# The compiled extension statically links MIT / BSD-2-Clause /
# Apache-2.0 crates, and all three require their notice text to travel
# with a *binary* redistribution -- which a wheel containing the linked
# extension is. Listing SPDX identifiers in the SBOM does not satisfy
# that; the texts themselves have to ship, so both notice files go into
# dist-info/licenses/ alongside our own LICENSE.
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md",
                 "THIRD-PARTY-LICENSES.md"]
authors = [{ name = "Fatin Ishraq" }]
keywords = [
    "lmer", "lme4", "mixed-effects", "mixed models", "multilevel",
    "hierarchical linear model", "REML", "random effects", "statsmodels",
    "mixedlm", "linear mixed model", "repeated measures",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

# patsy is required, not optional: the documented first example -- and the
# `mixedlm(...)` entry point that mirrors statsmodels' formula API -- needs it,
# so a clean install of the base package has to be able to run it.
# Floors verified by execution, not by reading changelogs: the full test
# suite runs green against exactly these versions on Python 3.10, and the CI
# "declared floors" job pins the same set. patsy is 0.5.3 rather than 0.5
# because 0.5.0 and 0.5.1 do `from collections import Mapping`, removed in
# Python 3.10, and 0.5.2 fails its own version check -- all three raise on
# import under every Python this package supports.
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "patsy>=0.5.3"]

[project.optional-dependencies]
# Kept as an empty extra so `pip install mixedlm-rs[formula]` keeps working for
# anyone who already wrote it; patsy is now in the base dependencies.
formula = []
test = ["pytest>=7", "statsmodels>=0.14"]
lint = ["ruff>=0.6", "mypy>=1.8"]
[project.urls]
Homepage = "https://github.com/fatin-ishraq/mixedlm-rs"
Repository = "https://github.com/fatin-ishraq/mixedlm-rs"
Changelog = "https://github.com/fatin-ishraq/mixedlm-rs/blob/main/CHANGELOG.md"
Issues = "https://github.com/fatin-ishraq/mixedlm-rs/issues"
Documentation = "https://github.com/fatin-ishraq/mixedlm-rs/blob/main/docs/COMPATIBILITY.md"


[tool.maturin]
python-source = "python"
module-name = "mixedlm_rs._mixedlm_rs"
features = ["pyo3/extension-module"]
# The public API is fully annotated (70/70 functions in mixed_linear_model.py,
# 3/3 in _install.py), so the marker is accurate. It was removed once, when the
# count was 0/42 -- shipping it then suppressed mypy's "missing stubs" warning
# and handed callers `Any` for everything, which is worse than no marker.
include = [
    { path = "python/mixedlm_rs/py.typed", format = "sdist" },
    { path = "python/mixedlm_rs/_mixedlm_rs.pyi", format = "sdist" },
]
# The lme4 datasets under data/ are GPL-2 test fixtures, and this project is
# MIT. The wheel never contained them, but the source archive did, which
# contradicted the licensing statement in the README. Excluded from both now;
# they live in the git repository only, and the oracle tests skip without them.
exclude = [
    "data/**",
    "bench/**",
    "proto/**",
    ".review/**",
    "dist/**",
    "target/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
markers = ["slow: runs an external tool or a long sweep"]

[tool.mypy]
# Not pinned to the package's own floor of 3.10: numpy's bundled stubs use
# `type` statements, which mypy will only parse under 3.12+, so pinning lower
# fails inside numpy rather than in this package. The annotations here are
# 3.10-compatible -- `from __future__ import annotations` is on every module
# and the CI test matrix imports the package on 3.10 itself.
python_version = "3.12"
# pandas ships no stubs by default and pandas-stubs disagrees with pandas 3.x
# on enough details to be noise here. numpy's own annotations are used.
ignore_missing_imports = true
files = ["tests/typing_usage.py"]
strict = true

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["dist", "target", ".review"]

[tool.ruff.lint]
# Pinned explicitly: relying on the default rule set means "ruff clean" changes
# meaning with the ruff version, which is not a check anyone can rely on.
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = [
    "E501",    # long lines are caught by the formatter, not worth failing on
    "RUF002",  # ambiguous unicode in docstrings (we write proper minus signs)
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Benchmarks and the prototype import after adjusting sys.path or after a
# guarded availability check, which is the point of them.
"bench/*" = ["E402"]
# The prototype is written to read like the equations it implements:
# short names (l for a Cholesky factor) and paired assignments on one
# line. That is the point of it as a reference, so those rules are off.
"proto/*" = ["E402", "E741", "E702", "RUF034"]
"tests/*" = ["E402"]
# The stage-13 regression tests quote the documents they check, including
# the en dashes in "44-64"; and two cases bind a lambda to a name purely so
# patsy can resolve it from the formula, which is the thing under test.
"tests/test_stage13_regressions.py" = ["E402", "RUF001", "F841"]
# The review-findings checker quotes documentation verbatim, en dashes and all.
"scripts/verify_review_findings.py" = ["RUF001"]
