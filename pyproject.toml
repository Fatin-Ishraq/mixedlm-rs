[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mixedlm-rs"
version = "0.1.0"
description = "Fast linear mixed-effects models for Python - lme4 speed, statsmodels API, no R required"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Fatin Ishraq" }]
keywords = [
    "lmer", "lme4", "mixed-effects", "mixed models", "multilevel",
    "hierarchical linear model", "REML", "random effects", "statsmodels",
    "mixedlm", "linear mixed model", "repeated measures",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# patsy is required, not optional: the documented first example -- and the
# `mixedlm(...)` entry point that mirrors statsmodels' formula API -- needs it,
# so a clean install of the base package has to be able to run it.
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "patsy>=0.5"]

[project.optional-dependencies]
# Kept as an empty extra so `pip install mixedlm-rs[formula]` keeps working for
# anyone who already wrote it; patsy is now in the base dependencies.
formula = []
test = ["pytest>=7", "statsmodels>=0.14"]

[tool.maturin]
python-source = "python"
module-name = "mixedlm_rs._mixedlm_rs"
features = ["pyo3/extension-module"]
# The lme4 datasets under data/ are GPL-2 test fixtures, and this project is
# MIT. The wheel never contained them, but the source archive did, which
# contradicted the licensing statement in the README. Excluded from both now;
# they live in the git repository only, and the oracle tests skip without them.
exclude = [
    "data/**",
    "bench/**",
    "proto/**",
    ".review/**",
    "dist/**",
    "target/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["dist", "target", ".review"]

[tool.ruff.lint]
# Pinned explicitly: relying on the default rule set means "ruff clean" changes
# meaning with the ruff version, which is not a check anyone can rely on.
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = [
    "E501",    # long lines are caught by the formatter, not worth failing on
    "RUF002",  # ambiguous unicode in docstrings (we write proper minus signs)
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Benchmarks and the prototype import after adjusting sys.path or after a
# guarded availability check, which is the point of them.
"bench/*" = ["E402"]
# The prototype is written to read like the equations it implements:
# short names (l for a Cholesky factor) and paired assignments on one
# line. That is the point of it as a reference, so those rules are off.
"proto/*" = ["E402", "E741", "E702", "RUF034"]
"tests/*" = ["E402"]
