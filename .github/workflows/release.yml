name: release

# Publishing is a one-way door: a version number, once uploaded to PyPI, can
# never be reused even after a delete. So this workflow builds everything,
# *installs and smoke-tests the actual artifacts*, and only then publishes.
#
# Two ways in:
#   - push a tag `v0.1.0`            -> builds, verifies, publishes to PyPI
#   - run it by hand (workflow_dispatch) -> builds, verifies, and publishes to
#     TestPyPI or nothing at all, so the whole path can be exercised without
#     spending a version number.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Where to publish after the artifacts verify"
        type: choice
        options: [nowhere, testpypi, pypi]
        default: nowhere

# Read-only by default -- enough for checkout and for the reusable CI call,
# and nothing else. The publish job asks for the one extra scope it needs.
# `permissions: {}` was too tight: it leaves actions/checkout and the called
# workflow without even contents:read.
permissions:
  contents: read

jobs:
  # The tag says 0.1.0 and pyproject says 0.1.1 is a mistake you cannot take
  # back once it is on PyPI, so it fails here instead.
  check-version:
    name: tag matches the declared version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with pyproject and Cargo
        run: |
          python -m pip install --quiet packaging
          python - <<'PY'
          import os, sys, tomllib, pathlib
          from packaging.version import InvalidVersion, Version

          declared = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          cargo = tomllib.loads(
              pathlib.Path("Cargo.toml").read_text())["package"]["version"]

          # PEP 440 equality, not string equality. `0.1` and `0.1.0` are the
          # same release -- both canonicalise to `0.1`, so PyPI treats an
          # upload of one as a collision with the other. Cargo, meanwhile,
          # requires all three semver components and rejects `0.1` outright.
          # Comparing the strings would fail a tag that is in fact correct.
          if Version(declared) != Version(cargo):
              sys.exit(f"pyproject says {declared}, Cargo.toml says {cargo}")
          print(f"pyproject {declared} and Cargo {cargo} agree")

          ref = os.environ.get("GITHUB_REF", "")
          if not ref.startswith("refs/tags/"):
              print(f"not a tag build; version {declared} is consistent")
              raise SystemExit(0)

          raw = ref.removeprefix("refs/tags/")
          try:
              tag = Version(raw.removeprefix("v"))
          except InvalidVersion:
              sys.exit(f"tag {raw!r} is not a PEP 440 version")
          if tag != Version(declared):
              sys.exit(
                  f"tag {raw} is version {tag}, but this tree declares "
                  f"{declared}. A wrong version on PyPI cannot be reused "
                  "after deletion, so this stops here.")
          print(f"tag {raw} matches the declared version {declared}")
          PY

  # The full CI suite, run against the exact commit being released. Publication
  # depends on this job, so a tag on an untested or failing commit stops here:
  # CI's own push trigger covers main and master, never tags, so before this
  # existed a tag could reach the publish step with no suite having run for it.
  tests:
    name: full CI for this commit
    needs: check-version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  wheels:
    name: wheel ${{ matrix.platform }}-${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The extension is built abi3-py310, so ONE wheel per platform
          # covers Python 3.10 through 3.14 -- there is no Python-version axis
          # here, unlike in ci.yml where the point is to test each of them.
          - { platform: linux,   target: x86_64,  runner: ubuntu-latest }
          - { platform: linux,   target: aarch64, runner: ubuntu-latest }
          - { platform: macos,   target: x86_64,  runner: macos-latest }
          - { platform: macos,   target: aarch64, runner: macos-latest }
          - { platform: windows, target: x64,     runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # maturin-action, not a bare `maturin build`, specifically for Linux:
      # it builds inside a manylinux container. A wheel built directly on
      # ubuntu-latest is tagged for that runner's glibc (2.39), which PyPI
      # accepts but which excludes every older distribution -- so it installs
      # for almost nobody. `manylinux: auto` picks a widely compatible base.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          sccache: true
      - name: Show the tags the build produced
        shell: bash
        run: ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          # `release-` prefixed, so the publish step can select exactly these
          # and nothing else. The called CI workflow uploads wheels of its own
          # under `wheels-<os>`, with filenames identical to these.
          name: release-wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: source archive
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      # The lme4 fixtures under data/ are GPL-2 and this project is MIT. This
      # is also checked in ci.yml; it is repeated here because this is the
      # copy that would actually be published.
      - name: The archive ships nothing GPL
        run: |
          python - <<'PY'
          import glob, tarfile
          [path] = glob.glob("dist/*.tar.gz")
          with tarfile.open(path) as t:
              names = t.getnames()
          leaked = [n for n in names if "/data/" in n or n.endswith("/data")]
          assert not leaked, f"GPL-2 fixtures leaked into the sdist: {leaked}"
          print(f"{path}: {len(names)} entries, no data/")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Each wheel is installed and *run* on a runner of its own platform. The
  # previous version installed only the Ubuntu-compatible wheel and read the
  # rest as ZIP files to check their notices; reading an archive is not running
  # it, and cross-compiling is not testing.
  verify-wheels:
    name: run wheel ${{ matrix.platform }}-${{ matrix.target }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every wheel this release builds appears here, on a runner of its
          # own architecture. `macos-13` was retired by GitHub in December
          # 2025; `macos-15-intel` is its replacement, and `ubuntu-24.04-arm`
          # lets the ARM64 Linux wheel be run rather than shipped untested.
          # Both labels are exercised by ci.yml's `architectures` job, which
          # also asserts the runner's Python reports the right machine.
          - { platform: linux,   target: x86_64,  runner: ubuntu-latest }
          - { platform: linux,   target: aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos,   target: aarch64, runner: macos-latest }
          - { platform: macos,   target: x86_64,  runner: macos-15-intel }
          - { platform: windows, target: x64,     runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: artifact
      - name: This runner is ${{ matrix.target }}
        shell: bash
        run: |
          python - <<'PY'
          import os, platform, sys
          want = os.environ["WANT"]
          aliases = {"x86_64": {"x86_64", "AMD64", "x64"},
                     "x64": {"x86_64", "AMD64", "x64"},
                     "aarch64": {"aarch64", "arm64", "ARM64"}}
          machine = platform.machine()
          print(f"machine={machine!r}")
          if machine not in aliases[want]:
              sys.exit(f"runner reports {machine!r}, not {want}; this wheel "
                       "would not be exercised on its own architecture")
          PY
        env:
          WANT: ${{ matrix.target }}
      # Installs the exact file, with dependencies resolving normally, then
      # checks pip's direct_url.json hash against the file on disk so
      # "installed from the intended artifact" is verified and not assumed.
      - name: Install and run this exact wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          wheel=$(ls artifact/*.whl | head -1)
          echo "verifying $wheel"
          python scripts/verify_release_artifacts.py --wheel "$wheel"
      # Record what was actually installed and run. The publish job admits
      # only files matching one of these records.
      - name: Record the verified artifact
        shell: bash
        run: |
          mkdir -p manifest
          python - <<'PY'
          import hashlib, json, os, pathlib
          wheel = sorted(pathlib.Path("artifact").glob("*.whl"))[0]
          record = {
              "filename": wheel.name,
              "sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "job": os.environ["JOB"],
              "runner": os.environ["RUNNER"],
          }
          out = pathlib.Path("manifest") / f"{os.environ['JOB']}.json"
          out.write_text(json.dumps(record, indent=1), encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY
        env:
          JOB: wheel-${{ matrix.platform }}-${{ matrix.target }}
          RUNNER: ${{ matrix.runner }}
      - uses: actions/upload-artifact@v4
        with:
          name: verified-wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: manifest/*.json
          if-no-files-found: error

  verify-sdist:
    name: rebuild and run the release sdist
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist
          path: artifact
      # Rebuilds a wheel from *this* archive and runs that, rather than
      # inspecting the tarball's file list. A source archive that unpacks but
      # does not build is a broken release.
      - name: Rebuild from the exact sdist and run it
        run: |
          python -m pip install --upgrade pip
          python scripts/verify_release_artifacts.py \
            --sdist "$(ls artifact/*.tar.gz | head -1)"
      - name: Record the verified artifact
        run: |
          mkdir -p manifest
          python - <<'PY'
          import hashlib, json, pathlib
          sdist = sorted(pathlib.Path("artifact").glob("*.tar.gz"))[0]
          pathlib.Path("manifest/sdist.json").write_text(json.dumps({
              "filename": sdist.name,
              "sha256": hashlib.sha256(sdist.read_bytes()).hexdigest(),
              "job": "sdist",
              "runner": "ubuntu-latest",
          }, indent=1), encoding="utf-8")
          print(pathlib.Path("manifest/sdist.json").read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-sdist
          path: manifest/*.json
          if-no-files-found: error

  notices:
    name: every artifact carries upstream notices
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          # Only this release's wheels. Without a pattern this downloads every
          # artifact in the run, which now includes the called CI workflow's
          # own wheels -- different builds with identical filenames.
          pattern: release-wheel-*
          path: collected
          merge-multiple: true
      # A static check, and labelled as one: it reads the archives. The
      # runtime evidence comes from verify-wheels and verify-sdist.
      - name: Read the notices out of every wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheels = sorted(glob.glob("collected/*.whl"))
          assert wheels, "no wheels were produced"
          bad = []
          for w in wheels:
              with zipfile.ZipFile(w) as z:
                  names = z.namelist()
                  notice = next(
                      (n for n in names
                       if n.endswith("THIRD-PARTY-LICENSES.md")), None)
                  if not notice:
                      bad.append(f"{w}: no upstream notices")
                      continue
                  body = z.read(notice).decode("utf-8")
              # The extension statically links BSD-2-Clause and MIT crates,
              # and both require their notice text to travel with a binary.
              if "Redistribution and use in source and binary forms" not in body:
                  bad.append(f"{w}: no BSD-2-Clause conditions")
              if body.count("Copyright") < 5:
                  bad.append(f"{w}: only {body.count('Copyright')} notices")
              if "\x1b[" in body:
                  bad.append(f"{w}: notices contain ANSI escape sequences")
          if bad:
              sys.exit("\n".join(bad))
          print(f"{len(wheels)} wheels, all carrying upstream notices")
          PY

  # Every wheel this release builds is installed and run on a runner of its
  # own architecture, so there is no cross-compiled-but-unexecuted artifact to
  # disclose. This job says so explicitly and fails if that stops being true,
  # because "which platforms were actually run" is exactly the claim that
  # should not have to be reconstructed from a job list.
  platform-coverage:
    name: every built wheel was executed
    needs: [verify-wheels, verify-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Built platforms and executed platforms agree
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, sys, yaml

          spec = yaml.safe_load(
              pathlib.Path(".github/workflows/release.yml").read_text())
          built = {(e["platform"], e["target"]) for e in
                   spec["jobs"]["wheels"]["strategy"]["matrix"]["include"]}
          ran = {(e["platform"], e["target"]): e["runner"] for e in
                 spec["jobs"]["verify-wheels"]["strategy"]["matrix"]["include"]}

          for key in sorted(built):
              state = f"executed on {ran[key]}" if key in ran else "NOT EXECUTED"
              print(f"  {key[0]}/{key[1]:<8} {state}")
          gap = sorted(built - set(ran))
          if gap:
              sys.exit(
                  "these wheels would be published without being run: "
                  + ", ".join(f"{p}/{t}" for p, t in gap)
                  + ". Either add a runner of that architecture to "
                    "verify-wheels, or stop building the wheel.")
          print(f"\nall {len(built)} wheels executed on their own architecture")
          PY

  # Assembling and checking the upload set is separated from uploading it, so
  # a `publish_to=nowhere` rehearsal exercises the part most likely to be
  # wrong. When these steps lived inside `publish`, they were skipped exactly
  # when someone was rehearsing -- the gate against publishing an unverified
  # file was the one thing a rehearsal could not test.
  #
  # The checked set is then handed to `publish` as a single artifact, so the
  # upload job cannot re-assemble a different one from the run's artifacts.
  release-set:
    name: the upload set is exactly what was verified
    needs: [wheels, sdist, verify-wheels, verify-sdist, notices,
            platform-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `pattern:` is the whole point. Downloading without one takes *every*
      # artifact in the run, and this run also contains the called CI
      # workflow's wheels -- different builds with filenames identical to the
      # release wheels. `merge-multiple` then flattens them into one
      # directory, where a CI wheel silently replaces the release wheel the
      # verify jobs actually installed and ran.
      - name: Download only this release's distributions
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # The verify jobs' records: filename and sha256 of what each installed
      # and ran on a runner of its own architecture.
      - name: Download the verification records
        uses: actions/download-artifact@v4
        with:
          pattern: verified-*
          path: manifests
      - run: ls -laR dist/ manifests/
      # Refuses an unexpected file, a missing one, a duplicate filename, or a
      # file whose hash changed after it was verified. `--expect 6` is the
      # five wheels plus the sdist: a platform that failed to build stops the
      # release rather than shipping a short set.
      - name: Every file to be published was verified
        run: |
          python scripts/check_release_set.py \
            --dist dist --manifests manifests --expect 6
      - name: Metadata is well formed
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check --strict dist/*
      - name: Publish the blessed set as one artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-verified-set
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish to ${{ inputs.publish_to || 'pypi' }}
    # Every gate: `tests` is the full CI suite for this exact commit, and
    # `release-set` has already checked the files against the hashes recorded
    # by the jobs that ran them.
    needs: [tests, release-set]
    if: >-
      github.event_name == 'push' ||
      inputs.publish_to == 'pypi' ||
      inputs.publish_to == 'testpypi'
    runs-on: ubuntu-latest
    # The environment is what makes a required reviewer possible: turn on
    # "Required reviewers" for it in Settings -> Environments and no upload
    # happens until a human clicks approve.
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_to == 'testpypi') && 'testpypi' || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_to == 'testpypi') && 'https://test.pypi.org/p/mixedlm-rs' || 'https://pypi.org/p/mixedlm-rs' }}
    permissions:
      contents: read
      # Trusted Publishing: GitHub mints a short-lived OIDC token that PyPI
      # verifies against the publisher you registered. There is no API token
      # to create, paste, rotate, or leak.
      id-token: write
    steps:
      # Exactly the set release-set checked, by name. Not a pattern, not a
      # merge: one artifact, assembled and verified in one place.
      - name: Download the verified set
        uses: actions/download-artifact@v4
        with:
          name: release-verified-set
          path: dist
      - run: ls -la dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_to == 'testpypi')
                && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          # Fail loudly rather than skipping a file that is already there:
          # a silent skip is how a release goes out missing a platform.
          skip-existing: false
          print-hash: true
