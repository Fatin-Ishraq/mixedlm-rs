name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # release.yml calls this on the exact commit being released. Without it,
  # publication was gated on nothing: CI's push trigger covers main and master,
  # not tags, so a tag on an untested or failing commit reached the publish
  # step with no suite having run for it.
  workflow_call:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Lint was never actually run in CI, so "ruff clean" and "clippy clean"
      # were claims nothing checked. The ruff rule set is pinned in
      # pyproject.toml so it means the same thing here as locally.
      - run: python -m pip install --upgrade pip ruff mypy maturin
      - run: python -m ruff check .
      # py.typed claims the annotations are usable, so a checker has to agree.
      # Counting annotated functions is not the same check and was the mistake
      # the first time round.
      - name: Build and install for the type checker
        run: |
          python -m maturin build --release --out dist
          python -m pip install --find-links dist --no-index --no-deps mixedlm-rs
          python -m pip install numpy scipy pandas patsy
      - run: python -m mypy tests/typing_usage.py --strict --ignore-missing-imports
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
      # `cargo fetch` with no --target vendors the sources for *every* target,
      # which is what the notices generator reads. A plain `cargo build` only
      # fetches the host's, so elsewhere the check can only skip -- this is the
      # one job where it actually runs.
      - name: Vendor every target's crate sources
        run: cargo fetch
      - name: Upstream licence texts are current
        run: python scripts/collect_notices.py --check
        env:
          MIXEDLM_CHECK_NOTICES: "1"

  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The package declares support for 3.10-3.14, so every one of them is
        # tested. Declaring a range and testing one point of it is how an
        # unsupported version ships.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      # Full history: tests/test_baseline.py resolves the commit the
      # numerical baseline was recorded at, and the default depth-1 checkout
      # does not contain it -- which silently disabled that gate in CI.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --out dist
          python -m pip install --find-links dist --no-index --no-deps mixedlm-rs
          python -m pip install numpy scipy pandas patsy pytest statsmodels
      - name: Rust tests
        run: cargo test --lib
      - name: Python tests
        run: pytest tests/ -q

  minimum-versions:
    name: minimum declared dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
      # pyproject declares numpy>=1.23, scipy>=1.9, pandas>=1.5, patsy>=0.5.3.
      # These are pinned to the *exact* advertised minimum, not to the release
      # series: "numpy==1.23.*" resolves to 1.23.5, which is not the version
      # the metadata promises to work. If 1.23.0 does not work, the floor is
      # wrong and should be raised rather than quietly relied upon -- which is
      # what happened to patsy: this job pinned 0.5.0, and 0.5.0 cannot be
      # imported on any Python this package supports.
      - name: Build and install at the exact declared floor
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --out dist
          python -m pip install --find-links dist --no-index --no-deps mixedlm-rs
          python -m pip install "numpy==1.23.0" "scipy==1.9.0" "pandas==1.5.0" \
                                "patsy==0.5.3" pytest
      - name: Show what was resolved
        run: python -m pip list | grep -Ei "numpy|scipy|pandas|patsy"
      - name: Python tests (statsmodels absent; differential tests skip)
        run: pytest tests/ -q

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo build --release

  native-safety:
    name: malformed input must raise, not abort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --out dist
          python -m pip install --find-links dist --no-index --no-deps mixedlm-rs
          # statsmodels included: the checker's differential findings compare
          # against it directly, and it imports it at module scope.
          python -m pip install numpy scipy pandas patsy pytest statsmodels
      # The checker inspects an sdist and shells out to cargo-audit. Neither
      # exists in a fresh job just because another job built or installed it --
      # jobs share no filesystem and no tools. Without these two steps the
      # checker cannot run those cases, which is the whole point of running it.
      - name: Build the sdist the checker inspects
        run: python -m maturin sdist --out dist
      - name: Install cargo-audit, which the checker shells out to
        run: cargo install cargo-audit --locked
      # Every finding from the two external reviews, re-checked against the
      # built artifact. Documentation claims are read from the files, and the
      # native-safety cases run in child processes.
      - name: Review findings stay fixed
        run: python scripts/verify_review_findings.py
      # The crate is built with panic="abort", so a missing bounds check is a
      # process kill rather than a catchable error. Each case runs in its own
      # child process, and a non-zero exit code is the failure signal -- an
      # in-process test cannot detect this at all.
      - name: Native boundary tests
        run: pytest tests/test_native_safety.py -q

  install-smoke:
    name: clean install runs the documented example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      # Installs the base package only -- no test extra, no statsmodels -- and
      # runs the formula example from the README. This is what catches a
      # dependency that is documented as optional but is actually required.
      - name: Build, install base package only, run the README example
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --out dist
          python -m pip install --find-links dist mixedlm-rs
          python - <<'PY'
          import numpy as np, pandas as pd, mixedlm_rs as mlm
          rng = np.random.default_rng(0)
          g = np.repeat(np.arange(20), 10)
          x = rng.normal(size=200)
          y = 1 + 0.5 * x + rng.normal(size=20)[g] + rng.normal(size=200) * 0.5
          d = pd.DataFrame({"y": y, "x": x, "g": g})
          r = mlm.mixedlm("y ~ x", d, groups=d["g"], re_formula="~x").fit()
          print(r.summary())
          assert r.converged
          PY

  artifacts:
    name: artifacts install and work ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      # Two complementary checks. verify_release.py builds both artifacts and
      # exercises the whole path; verify_release_artifacts.py is the single
      # -artifact verifier the release workflow runs on each platform, so a
      # break in it surfaces here rather than during a release.
      - name: The per-artifact verifier the release workflow uses
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --out dist
          python -m maturin sdist --out dist
          python scripts/verify_release_artifacts.py             --wheel "$(ls dist/*.whl | head -1)"             --sdist "$(ls dist/*.tar.gz | head -1)"
        shell: bash
      # Builds a wheel and an sdist, installs the exact wheel into a clean
      # venv *outside* the checkout, rebuilds a wheel from the unpacked sdist,
      # and runs the documented example, numerical smoke tests and save/load
      # against each. Installing inside the source tree proves nothing:
      # Python would import python/mixedlm_rs/ and never touch the artifact.
      - name: Verify the release artifacts
        run: |
          python -m pip install --upgrade pip maturin
          python scripts/verify_release.py

  sdist-contents:
    name: source archive ships nothing GPL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      # The lme4 fixtures under data/ are GPL-2 and this project is MIT. The
      # sdist used to contain them, contradicting the README.
      - name: Build sdist and check it
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin sdist --out dist
          python - <<'PY'
          import glob, tarfile
          [path] = glob.glob("dist/*.tar.gz")
          with tarfile.open(path) as t:
              names = t.getnames()
          leaked = [n for n in names if "/data/" in n or n.endswith("/data")]
          assert not leaked, f"GPL-2 fixtures leaked into the sdist: {leaked}"
          print(f"{path}: {len(names)} entries, no data/ directory")
          PY

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      # Both ecosystems, both on every run. An advisory that only surfaces
      # when someone remembers to look is not a control.
      - name: Rust advisories
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings
      # Audits the *declared* dependency set, not whatever is installed
      # alongside it. Auditing an environment reports advisories for unrelated
      # tooling that shares the interpreter, which says nothing about this
      # package -- see the reachability note in SECURITY.md.
      - name: Python advisories
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit --strict --requirement requirements-runtime.txt

  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build abi3 wheel
        run: |
          python -m pip install --upgrade pip maturin
          python -m maturin build --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
